<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AndFilm | Registration</title>
    <link rel="stylesheet" href="registration.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="shortcut icon" href="../andfilm_logo.png" type="image/x-icon">
</head>
<body>
 <div class="boss">
  <main id="main">
    <div id="girl-div"></div>
   <div class="reg-div">
    <div id="register-close-div">
     <div id="register-close-div-sign-up">
     <div class="register-close-div-sign-up-h1">Hi, Friend</div>
     <div class="register-close-div-sign-up-text">Register with your person all details to use all of site features</div>
     <button id="register-close-div-sign-up-btn">Sign UP</button>
     </div>

      <div id="register-close-div-sign-in">
     <div class="register-close-div-sign-in-h1">Welcome Back!</div>
     <div class="register-close-div-sign-in-text">Enter your person details to use all of site features</div>
     <button id="register-close-div-sign-in-btn">Sign In</button>
     </div>

    </div>
    <div id="sign-in">
     <h1 class="sign-in-h1">Sign In</h1>
     <div class="sign-in-methods-div">
      <a class="sign-in-a" href="#" draggable="false">
       <div class="sign-in-methods">
        <i class="fa-brands fa-google-plus-g"></i>
       </div>
      </a>
      <a class="sign-in-a" href="#" draggable="false">
       <div class="sign-in-methods">
        <i class="fa-brands fa-apple"></i>
       </div>
      </a>
      <a class="sign-in-a" href="#" draggable="false">
       <div class="sign-in-methods">
        <i class="fa-brands fa-github"></i>
       </div>
      </a>
      <a class="sign-in-a" href="#" draggable="false">
       <div class="sign-in-methods">
        <i class="fa-brands fa-linkedin-in"></i>
       </div>
      </a>
     </div>
     <div class="sign-in-other-text">or use your email password</div>
     <form id="sign_in_form" action="../main.html">
     <input class="sign-in-input" type="email"placeholder="Email" required spellcheck="false">
     <input class="sign-in-input" type="password" placeholder="Password" required spellcheck="false">
     </form>
     <span class="sign-in-forgot-text">Forgot Your Password?</span>
     <button form="sign_in_form" id="sign-in-btn">Sign In</button>
    </div>
    <div id="sign-up">
    <h1 class="sign-up-h1">Create Account</h1>
     <div class="sign-up-methods-div">
      <a class="sign-up-a" href="#" draggable="false">
       <div class="sign-up-methods">
        <i class="fa-brands fa-google-plus-g"></i>
       </div>
      </a>
      <a class="sign-up-a" href="#" draggable="false">
       <div class="sign-in-methods">
        <i class="fa-brands fa-apple"></i>
       </div>
      </a>
      <a class="sign-up-a" href="#" draggable="false">
       <div class="sign-up-methods">
        <i class="fa-brands fa-github"></i>
       </div>
      </a>
      <a class="sign-up-a" href="#" draggable="false">
       <div class="sign-up-methods">
        <i class="fa-brands fa-linkedin-in"></i>
       </div>
      </a>
     </div>
     <div class="sign-up-other-text">or use your email for registration</div>
     <form id="sign_up_form" action="../main.html">
      <input class="sign-up-input" type="text" placeholder="Name" required spellcheck="false">
      <input class="sign-up-input" type="email" placeholder="Email" required spellcheck="false">
      <input class="sign-up-input" type="password" placeholder="Password" required spellcheck="false">
      <button id="sign-up-btn">Sign Up</button>
     </form>
    </div>
   </div>
  </main>

 </div>

 <script src="registration.js"></script>
</body>
</html>
